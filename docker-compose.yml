  #     POSTGRES_DB: mok
  #     POSTGRES_USER: mok
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
  #   volumes:
  #     - db-data:/var/lib/postgresql/data

volumes:
  next-cache:
