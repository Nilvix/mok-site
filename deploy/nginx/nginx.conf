# Обратный прокси перед сайтом МОК.
# Защита от флуда/L7-DDoS: лимиты запросов и соединений с одного IP, короткие таймауты,
# ограничение размера тела, отсечение сканеров. От объёмных атак (L3/L4) защищает хостинг.

worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;

  # --- лимиты ---
  # Обычные страницы: 20 запросов/сек с IP (+ всплеск ниже)
  limit_req_zone  $binary_remote_addr zone=site:20m  rate=20r/s;
  # Админ-панель: 5 запросов/сек; вход: 10 в минуту
  limit_req_zone  $binary_remote_addr zone=admin:10m rate=5r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
  # API: 2 запроса/сек
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # --- таймауты и размеры (медленные атаки вроде Slowloris) ---
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          15s;
  keepalive_timeout     20s;
  client_max_body_size  1m;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  upstream web {
    server web:3000;
    keepalive 32;
  }

  # Общие настройки проксирования. Заголовки с IP перезаписываются (не дополняются),
  # чтобы клиент не мог подставить чужой адрес и обойти лимиты входа.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80 default_server;
    server_name _;

    limit_conn conn 30;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Сканеры уязвимостей: закрыть соединение без ответа
    location ~* (\.env|\.git|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.php$) {
      return 444;
    }

    location /_next/static/ {
      limit_req zone=site burst=200 nodelay;
      proxy_pass http://web;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://web;
    }

    location /admin {
      limit_req zone=admin burst=20 nodelay;
      proxy_pass http://web;
    }

    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://web;
    }

    location / {
      limit_req zone=site burst=60 nodelay;
      proxy_pass http://web;
    }
  }

  # HTTPS включается при развёртывании на сервере (certbot/Let's Encrypt) — см. README.
}
